name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package
        shell: powershell
        run: .\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageMini-Windows
          path: dist/CodexUsageMini-v0.3.0-portable.zip
